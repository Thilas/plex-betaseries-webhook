name: Release

on:
  schedule:
    - cron: 0 6 * * *
      timezone: Europe/Paris
  workflow_dispatch:

env:
  NODE_VERSION: 24.x

jobs:
  semantic-release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 10

    steps:
      - name: Generate a token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Get all tags

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Semantic release
        uses: cycjimmy/semantic-release-action@8be816a60e417d22b0e09b61adc23605036497eb # v7.1.0
        id: semantic
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          semantic_version: 25.0.9
          extra_plugins: conventional-changelog-conventionalcommits@9

      - name: New release published
        if: steps.semantic.outputs.new_release_published == 'true'
        run: echo "### Release ${{ steps.semantic.outputs.new_release_version }} created :rocket:" >> $GITHUB_STEP_SUMMARY
